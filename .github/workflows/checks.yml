name: Stack review
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, edited, synchronize]
permissions:
  contents: read
jobs:
  main:
    name: Validate main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests
  data:
    name: Validate stack data
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Read the base branch validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Read the proposed files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: proposed
          fetch-depth: 2
          persist-credentials: false
      - name: Check contribution scope
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C proposed rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git -C proposed rev-parse HEAD^1)" = "$BASE_SHA"
          git -C proposed rev-parse --verify 'HEAD^2' >/dev/null
          git -C proposed diff --no-ext-diff --no-textconv --name-status -z -M HEAD^1 HEAD -- |
            python3 -I trusted/scripts/check_contribution.py trusted
      - name: Check the proposed stack data
        run: python3 -I trusted/scripts/validate.py proposed
      - name: Check credits against the trusted base
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          set -euo pipefail
          git -C proposed diff --no-ext-diff --no-textconv --name-status -z -M HEAD^1 HEAD -- |
            python3 -I trusted/scripts/credits.py --check trusted proposed
  certification:
    name: Contributor agreement
    if: github.event_name == 'pull_request'
    concurrency:
      group: stack-certification-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Read only the certification checker from the base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check the submitter's certification
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f trusted/scripts/check_certification.py ]]; then
            echo 'The trusted base does not yet contain the v1 certification checker. This policy transition needs owner review under the existing rules.'
            exit 1
          fi
          python3 -I trusted/scripts/check_certification.py
