name: New stack
description: Suggest a new kind of stack
labels: [new-stack]
body:
  - type: input
    id: kind
    attributes:
      label: Kind of stack
      description: What kind of work does this stack cover?
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who it helps
      description: Who would use this stack?
    validations:
      required: true
  - type: textarea
    id: tools
    attributes:
      label: Starter tools
      description: List at least three tools with links to their official sources.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: One workflow
      description: Describe a workflow using these tools. Do not include sensitive data.
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: Observable success check
      description: How can someone see the workflow worked?
    validations:
      required: true
  - type: textarea
    id: models
    attributes:
      label: Models
      description: List any relevant models and links.
